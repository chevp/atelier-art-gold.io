name: Deploy to Firebase Hosting on commit to main

on:
  push:
    branches:
      - main
    paths:
      - 'apps/angular-app/**'  # Only trigger if something inside apps/angular-app/ changes

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Node.js 20
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: Install Firebase CLI globally
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # Step 4: Install dependencies and build the Angular app
      - name: Install & Build Angular
        run: |
          cd apps/angular-app
          npm install
          npx ng build --configuration production

      # Step 5: Deploy to Firebase Hosting
      - name: Deploy to Firebase
        run: |
          firebase deploy --only hosting --project scoe-8a318
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_DEPLOY_TOKEN }}
