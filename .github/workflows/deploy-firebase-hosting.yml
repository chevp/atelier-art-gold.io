name: Deploy to Firebase Hosting on commit to main

on:
  push:
    branches:
      - main
    paths:
      - 'apps/angular-app/**'  # Only trigger if something inside apps/angular-app/ changes

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Node.js (update to at least version 18.x)
      - uses: actions/setup-node@v2
        with:
          node-version: '20'

      # Step 3: Install dependencies and build the Angular app
      - run: |
          cd apps/angular-app
          npm install
          ./node_modules/.bin/ng build --configuration production

      # Step 4: Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCOE_8A318 }}
          channelId: live
          projectId: scoe-8a318
          entryPoint: apps/angular-app
